if (["yes", "no", "pending"].indexOf(TAB) < 0) TAB = "yes";
var INVITE = function(g){ return "Afzalus Salaam " + g.n + " \u{1F3C1}\n"

function tally(g){ return "https://tally.so/r/J9Qyrr?family=" + encodeURIComponent(g.n) + "&pax=" + (g.seats || 1); }
function tel(g){ return "tel:+" + g.w; }
function wa(g){ return "https://wa.me/" + g.w + "?text=" + encodeURIComponent(INVITE(g)); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]; }); }
function metaLine(g, kind){
  var bits = [g.seats + (g.seats === "1" ? " seat" : " seats")];
  if (kind === "yes") bits.push(g.heads + " coming");
  if (kind === "pending") bits.push("no reply yet");
  return bits.join(" &middot; ");
}
function render(){
  var q = (document.getElementById("q").value || "").trim().toLowerCase();
  var rows = D[TAB].filter(function(g){ return !q || g.n.toLowerCase().indexOf(q) > -1; });
  var html = rows.map(function(g, i){

    } else {
      acts = '<a class="wa" href="' + esc(wa(g)) + '">WhatsApp</a>'
           + '<a class="call" href="' + esc(tel(g)) + '">Call</a>';

    }

}

});
